# Security checks on every push to main and every pull request, plus weekly:
# static analysis (CodeQL), secret scanning of the whole history (gitleaks) and known-vulnerable
# dependencies (pip-audit). Needs no repository secrets.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pip-audit
      - name: Audit installed dependencies
        run: pip-audit --skip-editable

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-listening-mcp"
version = "0.0.1"
description = "Data-agnostic social-listening tools for LLM agents (MCP), built on public or synthetic data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Moch Ari Nasichuddin" }]
dependencies = ["pyyaml>=6", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
slmcp-server = "slmcp.server:main"

[tool.setuptools]
packages = ["slmcp", "slmcp.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
